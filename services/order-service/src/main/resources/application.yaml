server:
  port: 8080

spring:
  application:
    name: order-service
  datasource:
    url: jdbc:postgresql://localhost:5432/orderdb
    username: demo
    password: demo
    hikari:
      maximum-pool-size: 5
  sql:
    init:
      mode: always

payment:
  base-url: http://localhost:8082

logging:
  level:
    com.example.order: TRACE
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] %logger{36} trace_id=%X{trace_id:-} - %msg%n"
