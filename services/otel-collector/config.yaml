receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
    spike_limit_mib: 64
  batch:
    timeout: 2s

exporters:
  otlp_grpc/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
  otlp_http/loki:
    endpoint: http://loki:3100/otlp
  otlp_http/mimir:
    endpoint: http://mimir:9009/otlp
  # Second metrics destination. Leave this commented until NEW_RELIC_LICENSE_KEY is set.
  # The US endpoint is the default. EU: https://otlp.eu01.nr-data.net
  # JP: https://otlp.jp.nr-data.net
  # otlp_http/newrelic:
  #   endpoint: https://otlp.nr-data.net
  #   headers:
  #     api-key: ${env:NEW_RELIC_LICENSE_KEY}
  #   compression: gzip

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp_grpc/tempo]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp_http/loki]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp_http/mimir]
      # Fan-out: the same metrics batch is sent to every exporter in the list.
      # exporters: [otlp_http/mimir, otlp_http/newrelic]
