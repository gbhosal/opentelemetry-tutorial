# Single-process Mimir for a local demo. Filesystem storage under /tmp is
# ephemeral: it survives `docker compose stop` and is discarded by `docker compose down`.

multitenancy_enabled: false

server:
  http_listen_port: 9009
  log_level: info

blocks_storage:
  backend: filesystem
  bucket_store:
    sync_dir: /tmp/mimir/tsdb-sync
  filesystem:
    dir: /tmp/mimir/data/tsdb
  tsdb:
    dir: /tmp/mimir/tsdb

compactor:
  data_dir: /tmp/mimir/compactor
  sharding_ring:
    kvstore:
      store: memberlist

distributor:
  ring:
    instance_addr: 127.0.0.1
    kvstore:
      store: memberlist

ingester:
  ring:
    instance_addr: 127.0.0.1
    kvstore:
      store: memberlist
    replication_factor: 1

store_gateway:
  sharding_ring:
    replication_factor: 1

ruler_storage:
  backend: filesystem
  filesystem:
    dir: /tmp/mimir/rules

limits:
  # Exemplars let Grafana jump from a metric sample to the related Tempo trace.
  max_global_exemplars_per_user: 100000
  ingestion_rate: 100000
  ingestion_burst_size: 200000

usage_stats:
  enabled: false
